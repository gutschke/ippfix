# dma's queue flush is Type=oneshot running "dma -q", which forks one delivery
# agent per queued message and returns immediately. With the default KillMode
# systemd then tears the cgroup down, killing every one of those agents
# mid-SMTP -- no error is logged, the messages stay queued, and the next flush
# five minutes later is killed the same way. Mail never leaves the machine.
#
# This is not ippfix's unit to fix, but ippfix's reports are the mail being
# lost, and the whole point of them is that a failure nobody is told about is
# the worst kind. So: correct it, narrowly, and only for the shipped unit.
# Drop-ins for a unit that is not installed are ignored, so this costs nothing
# on a machine using a different mail system.
[Service]
KillMode=process

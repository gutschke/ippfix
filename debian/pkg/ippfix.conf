# Configuration for ippfix(8).  Restart the service after editing:
#     systemctl restart ippfix
#
# IPPFIX_ARGS holds the command line.  At minimum, name each printer you want
# to publish as NAME=URI.  The name becomes the queue: "Front Desk" is
# published as ipp://this-host/ipp/front-desk.
#
#     IPPFIX_ARGS="upstairs=ipp://printer1.example/ipp/print"
#
# Several printers are fine; each gets its own queue:
#
#     IPPFIX_ARGS="upstairs=ipp://printer1.example/ipp/print \
#                  downstairs=ipp://printer2.example/ipp/print"
#
# Useful options -- see ippfix(8) for the rest:
#   --advertise ADDR   the address clients should use, if autodetection is wrong
#   --no-advertise     do not publish over DNS-SD at all
#   --archive DIR      keep a copy of every job.  THIS STORES USERS' DOCUMENTS.
#                      A diagnostic, not a setting; turn it off again afterwards.
#
# The service does nothing until at least one printer is named here.
IPPFIX_ARGS=""
